name: Publication

# Le garde-fou est un préalable bloquant, pas un contrôle parallèle : aucune
# construction ne démarre tant qu'il n'est pas vert, et rien n'atteint Pages
# sans être passé par lui.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  garde-fou:
    name: Garde-fou anti-fuite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Le test tourne avant le garde-fou : on vérifie que le contrôle mord
      # avant de lui faire confiance pour dire que le dépôt est propre.
      - name: Vérifier que le garde-fou mord
        run: node scripts/test-garde-fou.mjs

      # Sans ce secret, le contrôle des valeurs littérales ne peut pas s'exécuter
      # et le garde-fou échoue plutôt que de laisser passer.
      - name: Contrôler le dépôt
        run: node scripts/garde-fou.mjs
        env:
          GARDE_FOU_SEL: ${{ secrets.GARDE_FOU_SEL }}

  historique:
    name: Garde-fou sur l'historique
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 est indispensable — le checkout par défaut est superficiel
      # et ne ramène qu'un commit, ce qui ferait passer ce contrôle pour vert
      # alors qu'il n'aurait rien inspecté.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Un dépôt public expose son historique. Une valeur commitée puis corrigée
      # reste lisible dans le commit qui l'a introduite : contrôler HEAD ne suffit pas.
      # Vérifie sur un dépôt jetable que le classement distingue bien une fuite
      # corrigeable d'une publication déjà faite, avant de lui faire confiance.
      - name: Vérifier le classement
        run: node scripts/test-garde-fou-historique.mjs

      - name: Contrôler chaque commit
        run: node scripts/garde-fou-historique.mjs
        env:
          GARDE_FOU_SEL: ${{ secrets.GARDE_FOU_SEL }}

  build:
    name: Construction du site
    needs: [garde-fou, historique]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      # Échoue si un fichier de data/derive/ ne respecte plus son schéma.
      - run: npm run build
        working-directory: site

      # Le schéma garantit la forme du fichier source ; ce test garantit celle du
      # rendu. L'ordre du DOM est une information au même titre que l'ordre du JSON.
      - name: Vérifier le rendu
        run: node scripts/test-rendu.mjs

      # `enablement` évite d'avoir à activer Pages à la main dans les réglages.
      # Sur un compte gratuit, Pages ne fonctionne que pour un dépôt public :
      # tant que celui-ci est privé, cette étape échoue — et c'est le seul point
      # qui bloque la publication.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
